name: Web quality
on:
  push:
    branches: [main, 'refactor/**', 'feature/**', 'fix/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: StageOps_Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: StageOps_Web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
